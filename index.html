<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Band Name Generator</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Rubik&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <div class="container" id="generatorContainer">
    <h1 class="title">🎸 Band Name Generator 🎤</h1>
    <div class="name-box" id="bandName">Click Generate!</div>
    <div class="buttons">
      <button onclick="generateName()">🎲 Generate</button>
      <button onclick="copyName()">📋 Copy</button>
      <button onclick="downloadGeneratorImage()">💾 Save Image</button>
    </div>
    <div class="social-share">
      <button onclick="shareOnTwitter()">🐦 Share on Twitter</button>
      <button onclick="shareOnMastodon()">🦣 Share on Mastodon</button>
    </div>
    <h2>Saved Names</h2>
    <ul id="savedNames"></ul>
    <label class="mode-toggle">
      <input type="checkbox" id="darkModeToggle" onclick="toggleDarkMode()" /> 🌙 Dark Mode
    </label>
  </div>

  <canvas id="downloadCanvas" style="display:none;"></canvas>
  <script src="script.js"></script>
</body>
</html>
