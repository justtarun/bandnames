<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Band Name Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>🎸 Band Name Generator 🎤</h1>
    <div class="name-box" id="bandName">Click Generate!</div>
    <div class="buttons">
      <button onclick="generateName()">Generate</button>
      <button onclick="saveName()">Save This Name</button>
      <button onclick="downloadName()">Share Image</button>
    </div>
    <div id="savedNames"></div>
  </div>

  <canvas id="downloadCanvas" style="display:none;"></canvas>
  <script src="script.js"></script>
</body>
</html>
