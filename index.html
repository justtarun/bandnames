<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Band Name Generator</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Rubik&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1 class="title">🎸 Band Name Generator 🎤</h1>
    <div class="name-box" id="bandName">Click Generate!</div>
    <div class="buttons">
      <button onclick="generateName()">🎲 Generate</button>
      <button onclick="saveName()">💾 Save</button>
      <button onclick="downloadName()">📷 Share Image</button>
    </div>
    <h2>Saved Names</h2>
    <ul id="savedNames"></ul>
  </div>

  <canvas id="downloadCanvas" style="display:none;"></canvas>
  <script src="script.js"></script>
</body>
</html>
